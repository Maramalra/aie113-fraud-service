[project]
name = "fraud-service"
version = "1.0.0"
description = "SDA-AIE-113 fraud track: card-fraud scoring service with reasons"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "model: needs the real trained model in artifacts/ (run `make train` first)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, import order, likely bugs, modern syntax
ignore = ["E702"]                    # V1..V28 fields are listed several per line on purpose

[tool.coverage.run]
source = ["src/fraud_service"]
